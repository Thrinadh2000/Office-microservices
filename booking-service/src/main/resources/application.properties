spring.application.name=booking-service
server.port=8082

# --- Its OWN database, completely separate from office-service's ---
spring.datasource.url=jdbc:h2:file:./data/bookingdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Where to find office-service. In a real deployment this would come from
# service discovery (Eureka/Consul) or a service mesh instead of a hardcoded
# URL — but a config value is the simplest correct starting point.
office-service.base-url=http://localhost:8081
