spring.application.name=office-service
server.port=8081

# --- Real database: H2 stored on disk (survives restarts), zero install needed ---
spring.datasource.url=jdbc:h2:file:./data/officedb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Optional: browse the DB at http://localhost:8081/h2-console
# (JDBC URL above, username sa, blank password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- To switch to real Postgres in production, replace the block above with: ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/officedb
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=your_password
# spring.jpa.hibernate.ddl-auto=validate
# (and add the postgresql driver dependency to pom.xml)
